<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shrimpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#06111d"/>
  <circle cx="50" cy="50" r="40" fill="url(#glowGrad)"/>

  <!-- Stylized Shrimp (Litopenaeus vannamei) -->
  <!-- Antennae -->
  <path d="M42 22 Q 25 10 12 18" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M44 24 Q 30 18 18 30" stroke="#7dd3fc" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Carapace / Head -->
  <path d="M40 26 C 60 22, 70 34, 68 45 C 55 52, 42 45, 40 26 Z" fill="url(#shrimpGrad)"/>
  
  <!-- Rostrum (spikes on head) -->
  <polygon points="40,25 33,18 42,28" fill="#38bdf8"/>
  <polygon points="43,24 38,16 46,27" fill="#7dd3fc"/>

  <!-- Abdominal segments -->
  <path d="M66 42 C 78 46, 82 58, 76 68 C 70 65, 65 52, 66 42 Z" fill="#0284c7"/>
  <path d="M74 65 C 76 74, 68 84, 56 86 C 56 78, 66 72, 74 65 Z" fill="#0369a1"/>
  <path d="M57 85 C 48 88, 38 84, 34 76 C 42 74, 50 78, 57 85 Z" fill="#0284c7"/>

  <!-- Telson & Uropods (Shrimp Tail Fan) -->
  <polygon points="34,76 20,78 28,70" fill="#38bdf8"/>
  <polygon points="33,75 18,72 26,66" fill="#7dd3fc"/>
  <polygon points="35,77 22,85 30,80" fill="#0284c7"/>

  <!-- Swimming Legs (Pleopods) -->
  <path d="M68 64 Q 62 72 58 75" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M60 74 Q 54 82 48 84" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M48 80 Q 42 86 38 88" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eye -->
  <circle cx="48" cy="30" r="3.2" fill="#06111d"/>
  <circle cx="47" cy="29" r="1.2" fill="#ffffff"/>
  
  <!-- AI Sparkle -->
  <circle cx="80" cy="24" r="3" fill="#a855f7"/>
  <circle cx="84" cy="18" r="1.5" fill="#c084fc"/>
</svg>
